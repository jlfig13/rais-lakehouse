# Catálogo de dados do RAIS Lakehouse (Aula 17). Fonte única das descrições.
# src/catalogo.py valida este arquivo (Pydantic), confere com o schema real das tabelas Delta,
# grava as descrições como COMMENT nas tabelas e exporta catalogo/rais.json (contexto para IA).
nome: rais
descricao: >-
  Microdados de vínculos formais de trabalho da RAIS (MTE), ano-base 2019 em diante,
  organizados em bronze (cópia fiel), silver (tipada e validada) e gold (respostas prontas).
dono: time de dados do projeto
regras:
  - "A unidade é o VÍNCULO de trabalho, não a pessoa: uma pessoa com dois empregos aparece duas vezes. Nunca escreva 'trabalhadores'."
  - "Para comparar anos, use as colunas em salários mínimos (*_sm). Valores *_nom são reais nominais e sofrem inflação."
  - "Indicadores de estoque (quantos empregos existem) usam só vínculos ativos em 31/12 (vinculo_ativo = true)."
  - "Taxa de desligamento usa todos os vínculos do ano, não só os ativos."
  - "Códigos (município, CNAE, CBO, UF) são texto: zeros à esquerda fazem parte do código."
  - "UF nula significa município fora da tabela de UFs (ex.: arquivo NI, não identificado)."

tabelas:
  # ------------------------------------------------------------------------------ bronze
  - nome: bronze.rais_vinculos
    caminho: bronze/rais_vinculos
    descricao: Cópia fiel dos arquivos .txt da RAIS, com nomes de coluna normalizados e todas as colunas como texto.
    grao: uma linha por linha do arquivo de origem (um vínculo)
    atualizacao: substitui só o ano processado (replaceWhere por ano)
    completa: false   # dezenas de colunas que variam por ano: descrevemos as usadas adiante
    colunas:
      - {nome: ano, descricao: Ano-base da RAIS (partição da tabela).}
      - {nome: arquivo_origem, descricao: Nome do arquivo .txt de onde a linha veio (rastreabilidade).}
      - {nome: municipio, descricao: Código IBGE de 6 dígitos do município do estabelecimento, como veio no arquivo.}
      - {nome: vl_remun_dezembro_nom, descricao: "Remuneração de dezembro em R$ nominais, texto com vírgula decimal."}

  # ------------------------------------------------------------------------------ silver
  - nome: silver.rais_vinculos
    caminho: silver/rais_vinculos
    descricao: Vínculos tipados e validados; valores inválidos viram NULL e nenhuma linha é descartada.
    grao: um vínculo de trabalho por linha (mesma contagem da bronze no ano)
    atualizacao: substitui só o ano processado (replaceWhere por ano)
    colunas:
      - {nome: ano, descricao: Ano-base da RAIS.}
      - {nome: cod_municipio, descricao: Código IBGE do município (6 dígitos) do estabelecimento; NULL se inválido.}
      - {nome: cod_uf, descricao: Código IBGE da UF (2 primeiros dígitos do município).}
      - {nome: cnae_classe, descricao: Classe CNAE 2.0 da atividade do estabelecimento (5 dígitos); NULL se inválida.}
      - {nome: cnae_divisao, descricao: Divisão CNAE (2 primeiros dígitos da classe).}
      - {nome: cbo, descricao: Ocupação na CBO 2002 (texto; zeros à esquerda importam).}
      - {nome: natureza_juridica, descricao: Código da natureza jurídica do estabelecimento.}
      - {nome: sexo, descricao: "Sexo do trabalhador: 1 = masculino, 2 = feminino (confira no dicionário do ano)."}
      - {nome: escolaridade, descricao: Grau de instrução (códigos 1 a 11; ver gold_escolaridade_ano).}
      - {nome: raca_cor, descricao: Código de raça/cor do dicionário da RAIS.}
      - {nome: idade, descricao: Idade em anos; NULL fora de 14 a 100.}
      - {nome: tamanho_estab, descricao: Faixa de tamanho do estabelecimento (código do dicionário).}
      - {nome: mes_desligamento, descricao: Mês do desligamento (1 a 12); NULL se o vínculo não foi desligado no ano.}
      - {nome: motivo_desligamento, descricao: Código do motivo do desligamento.}
      - {nome: tempo_emprego_meses, descricao: Tempo de emprego no vínculo, em meses., unidade: meses}
      - {nome: vinculo_ativo, descricao: Verdadeiro se o vínculo estava ativo em 31/12 do ano-base.}
      - {nome: desligado_no_ano, descricao: Verdadeiro se houve desligamento no ano (mes_desligamento preenchido).}
      - {nome: remun_dezembro_nom, descricao: Remuneração de dezembro em reais nominais., unidade: R$ nominais}
      - {nome: remun_media_nom, descricao: Remuneração média do ano em reais nominais., unidade: R$ nominais}
      - {nome: remun_dezembro_sm, descricao: Remuneração de dezembro em salários mínimos (comparável entre anos)., unidade: salários mínimos}
      - {nome: remun_media_sm, descricao: Remuneração média do ano em salários mínimos (comparável entre anos)., unidade: salários mínimos}

  # ------------------------------------------------------------------------------ gold
  - nome: gold.gold_emprego_uf_ano
    caminho: gold/gold_emprego_uf_ano
    descricao: Estoque de vínculos ativos e remuneração por UF e ano.
    pergunta: Quantos vínculos ativos existem e quanto pagam, por UF e ano?
    grao: ano × UF
    atualizacao: recalculada inteira a cada execução da gold
    colunas:
      - {nome: ano, descricao: Ano-base.}
      - {nome: cod_uf, descricao: Código IBGE da UF.}
      - {nome: uf, descricao: Sigla da UF; NULL se o código não está na dimensão.}
      - {nome: qtd_vinculos, descricao: Vínculos ativos em 31/12., unidade: vínculos}
      - {nome: massa_salarial_dez_nom, descricao: Soma das remunerações de dezembro dos vínculos ativos., unidade: R$ nominais}
      - {nome: remun_media_dez_nom, descricao: Média da remuneração de dezembro., unidade: R$ nominais}
      - {nome: remun_media_dez_sm, descricao: Média da remuneração de dezembro em salários mínimos., unidade: salários mínimos}
      - {nome: remun_mediana_dez_sm, descricao: Mediana aproximada da remuneração de dezembro em salários mínimos., unidade: salários mínimos}

  - nome: gold.gold_gap_sexo_uf_ano
    caminho: gold/gold_gap_sexo_uf_ano
    descricao: Remuneração média de mulheres e homens e a razão entre elas, por UF e ano.
    pergunta: Quanto a remuneração média das mulheres representa da dos homens?
    grao: ano × UF
    atualizacao: recalculada inteira a cada execução da gold
    colunas:
      - {nome: ano, descricao: Ano-base.}
      - {nome: cod_uf, descricao: Código IBGE da UF.}
      - {nome: uf, descricao: Sigla da UF.}
      - {nome: rem_mulher_sm, descricao: Média da remuneração de dezembro dos vínculos femininos ativos., unidade: salários mínimos}
      - {nome: rem_homem_sm, descricao: Média da remuneração de dezembro dos vínculos masculinos ativos., unidade: salários mínimos}
      - {nome: razao_mulher_homem, descricao: "rem_mulher_sm / rem_homem_sm; 0,75 = mulheres recebem em média 75% do que recebem os homens.", unidade: razão}

  - nome: gold.gold_top_cnae_uf_ano
    caminho: gold/gold_top_cnae_uf_ano
    descricao: As 10 divisões CNAE com maior massa salarial de dezembro em cada UF e ano.
    pergunta: Quais atividades concentram a massa salarial em cada UF?
    grao: ano × UF × divisão CNAE (no máximo 10 por ano e UF)
    atualizacao: recalculada inteira a cada execução da gold
    colunas:
      - {nome: ano, descricao: Ano-base.}
      - {nome: cod_uf, descricao: Código IBGE da UF.}
      - {nome: uf, descricao: Sigla da UF.}
      - {nome: cnae_divisao, descricao: Divisão CNAE 2.0 (2 dígitos).}
      - {nome: qtd_vinculos, descricao: Vínculos ativos da divisão., unidade: vínculos}
      - {nome: massa_salarial_dez_nom, descricao: Soma das remunerações de dezembro da divisão., unidade: R$ nominais}
      - {nome: posicao, descricao: Posição no ranking da UF e ano (1 = maior massa salarial).}

  - nome: gold.gold_escolaridade_ano
    caminho: gold/gold_escolaridade_ano
    descricao: Vínculos ativos e remuneração média por grau de instrução e ano.
    pergunta: Como a remuneração varia com a escolaridade?
    grao: ano × escolaridade
    atualizacao: recalculada inteira a cada execução da gold
    colunas:
      - {nome: ano, descricao: Ano-base.}
      - {nome: escolaridade, descricao: Código do grau de instrução (1 a 11).}
      - {nome: escolaridade_desc, descricao: Rótulo do grau de instrução.}
      - {nome: qtd_vinculos, descricao: Vínculos ativos., unidade: vínculos}
      - {nome: remun_media_dez_sm, descricao: Média da remuneração de dezembro., unidade: salários mínimos}

  - nome: gold.gold_desligamento_uf_ano
    caminho: gold/gold_desligamento_uf_ano
    descricao: Proporção de vínculos desligados no ano, por UF.
    pergunta: Qual a proporção de vínculos desligados no ano?
    grao: ano × UF
    atualizacao: recalculada inteira a cada execução da gold
    colunas:
      - {nome: ano, descricao: Ano-base.}
      - {nome: cod_uf, descricao: Código IBGE da UF.}
      - {nome: uf, descricao: Sigla da UF.}
      - {nome: qtd_vinculos_no_ano, descricao: Todos os vínculos do ano (ativos ou não)., unidade: vínculos}
      - {nome: qtd_desligados, descricao: Vínculos com desligamento no ano., unidade: vínculos}
      - {nome: taxa_desligamento, descricao: "qtd_desligados / qtd_vinculos_no_ano (0 a 1).", unidade: proporção}
