[project]
name = "rais-lakehouse"
version = "0.1.0"
description = "Lakehouse open source da RAIS com PySpark, Delta Lake e MinIO"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "curso"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]   # erros, imports, bugs comuns, sintaxe moderna

[tool.ruff.lint.per-file-ignores]
# Checks: mensagens de erro longas e legíveis valem mais que o limite de linha.
"labcheck/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
